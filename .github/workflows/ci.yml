name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Reproducible builds are a release gate (SPEC §12.4). Pin the toolchain here.
  PNPM_VERSION: "10.34.5"
  NODE_VERSION_DEFAULT: "20"

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SPEC §12.1 compatibility matrix: Node 20 and 22.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Conformance index integrity (SEC-007)
        run: pnpm conformance:check

      - name: Release manifest signature (SEC-007)
        run: pnpm manifest:verify

      - name: Test
        run: pnpm test

      - name: Coverage thresholds (SPEC §12.1)
        run: pnpm --filter tx402 exec vitest run --coverage

      - name: Build
        run: pnpm build

      - name: Size gate (ADR-008)
        run: pnpm size

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tx402-python
    strategy:
      fail-fast: false
      matrix:
        # SPEC §12.1 compatibility matrix: CPython 3.10-3.13.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --all-extras --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      # Coverage thresholds are enforced through pytest addopts (SPEC §12.1).
      - name: Test
        run: uv run pytest -q

      - name: Build distributions
        run: uv build

  # Cross-language parity is a release gate (SPEC §12.4, ADR-005). Both SDKs execute the
  # same vectors from core-spec/conformance; this job runs the two suites side by side so a
  # parity break is reported as one failure rather than two unrelated ones.
  conformance:
    name: Conformance parity (TS ↔ Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install TypeScript workspace
        run: pnpm install --frozen-lockfile

      - name: Conformance index integrity
        run: pnpm conformance:check

      - name: TypeScript conformance + package contract
        run: pnpm --filter tx402 test

      - name: Python conformance + package contract
        working-directory: packages/tx402-python
        run: |
          uv sync --all-extras
          uv run pytest -q
